[project]
site_name = "Cours Bases de donn&eacute;es 2"
site_url = "https://bd2.kerzo.ca/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
language = "fr"

nav = [
{"Accueil" = "index.md"},
{"Modélisation" = [
     "modelisation/definition_modelisation.md",
     "modelisation/modele_entites_relations.md",
     "modelisation/schema_conceptuel.md",
     "modelisation/types_relations.md",
     "modelisation/normalisation.md",
     "modelisation/classes.md"
]},
{"MySQL" = [
     "mysql/creation_bd.md",
     "mysql/creation_table.md",
     "mysql/convention.md",
     "mysql/types_jointures.md",
     "mysql/vues.md",
     "mysql/insertion.md",
     "mysql/declencheurs.md",
     "mysql/fonctions.md",
     "mysql/procedures.md",
     "mysql/transactions.md",
     "mysql/gestion_erreurs.md",
     "mysql/curseurs.md"
]},
{"Python" = [
     "python/installation.md",
     "python/dotenv.md",
     "python/flask.md",
     "python/pip.md",
     "python/mysql_connector.md",
     "python/venv.md",
     "python/documentation.md",
]},
{"Exercices" = [
     "exercices/ex01_enonce.md",
     "exercices/ex02_enonce.md",
     "exercices/ex03_enonce.md",
     "exercices/ex04_enonce.md",
     "exercices/ex05_enonce.md",
     "exercices/ex06_enonce.md",
     "exercices/ex07_enonce.md",
     "exercices/ex08_enonce.md",
     "exercices/ex09_enonce.md",
     "exercices/ex10_enonce.md",
     "exercices/ex11_enonce.md",
     "exercices/ex12_enonce.md",
     "exercices/ex13_enonce.md"
]},
{"Outils de travail" = [
     "outils/dbeaver.md",
     "outils/drawio.md"
]},
{"Évaluations" = [
     "evaluations/resume.md",
     "evaluations/evaluation_formative_formelle.md",
     "evaluations/projet_long.md"
]},
{"Horaire" = "horaire.md" }, 
{"À propos" = "apropos.md"},
{"Déclaration sur l'utilisation de l'IA" = "declaration-ia.md"}
    
]

extra_css = ["stylesheets/all.css", "stylesheets/extra.css"]

[project.theme.icon]
logo = "fontawesome/solid/database"

[project.theme]
name = "material"
custom_dir = "overrides"
favicon = "favicon.ico"
language = "fr"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[project.plugins]
search = {}

# Extensions Markdown : liste par défaut de Zensical + snippets pour inclure
# le code du dossier code/ (ex. --8<-- "demo-flask/app.py")
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions."pymdownx.arithmatex"]
generic = true
[project.markdown_extensions."pymdownx.betterem"]
[project.markdown_extensions."pymdownx.caret"]
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.emoji"]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.keys"]
[project.markdown_extensions."pymdownx.magiclink"]
[project.markdown_extensions."pymdownx.mark"]
[project.markdown_extensions."pymdownx.smartsymbols"]
[project.markdown_extensions."pymdownx.snippets"]
base_path = ["code"]
check_paths = true
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid" }]
[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true
[project.markdown_extensions."pymdownx.tilde"]
